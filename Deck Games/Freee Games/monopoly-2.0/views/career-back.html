<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{{ deck.title }} — рубашка</title>
  <style>
    {% include 'career-back.scss' %}
  </style>
</head>
<body>
{% for card in cards %}
  <article class="card-back" style="width: {{ deck.card_width_mm }}mm; height: {{ deck.card_height_mm }}mm;">
    <div class="inner">
      <div class="game">{{ game_name }}</div>
      <div class="title">{{ deck.title }}</div>
      <div class="category">{{ deck.category }}</div>
      {% if deck.vars and deck.vars['level-names'] %}
      <ul class="career-path">
        {% for step, name in deck.vars['level-names']|items %}
        <li{% if name == card.name %} class="current"{% endif %}>{{ name }}</li>
        {% endfor %}
      </ul>
      {% endif %}
    </div>
  </article>
{% endfor %}
</body>
</html>

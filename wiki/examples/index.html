<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Примеры работ — Game Deck Generator</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #ececec;
      color: #222;
    }
    form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #ccc;
    }
    label { font-size: 15px; }
    select, button {
      font: inherit;
      padding: 6px 10px;
    }
    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 64px);
      border: 0;
      background: #d8d8d8;
    }
  </style>
</head>
<body>
  <form id="examples-form" action="#" method="get">
    <label for="example">Колода</label>
    <select id="example" name="example">
      <option value="monopoly.professions.level_0/preview.html">Монополия — профессии L0</option>
      <option value="monopoly.achievements/preview.html">Монополия — достижения</option>
      <option value="monopoly.events.positives.lucky_day/preview.html">Монополия — счастливый день</option>
      <option value="monopoly.events.negatives.pandemic/preview.html">Монополия — пандемия</option>
      <option value="monopoly.professions.tracking.judge/preview.html">Монополия — судья (трекинг)</option>
      <option value="new-game.deck-1st/preview.html">Шаблон new-game — первая колода</option>
    </select>
    <button type="button" id="prev" aria-label="Предыдущий пример">←</button>
    <button type="button" id="next" aria-label="Следующий пример">→</button>
  </form>
  <iframe id="view" title="Превью колоды" src="monopoly.professions.level_0/preview.html"></iframe>
  <script>
    (function () {
      var sel = document.getElementById("example");
      var frame = document.getElementById("view");
      var form = document.getElementById("examples-form");
      function show(i) {
        var n = sel.options.length;
        sel.selectedIndex = ((i % n) + n) % n;
        frame.src = sel.value;
      }
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        show(sel.selectedIndex);
      });
      sel.addEventListener("change", function () { show(sel.selectedIndex); });
      document.getElementById("prev").addEventListener("click", function () { show(sel.selectedIndex - 1); });
      document.getElementById("next").addEventListener("click", function () { show(sel.selectedIndex + 1); });
      var params = new URLSearchParams(location.search);
      var q = params.get("example");
      if (q) {
        for (var i = 0; i < sel.options.length; i++) {
          if (sel.options[i].value.indexOf(q) !== -1) { show(i); break; }
        }
      }
    })();
  </script>
</body>
</html>

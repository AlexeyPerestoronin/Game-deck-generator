<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>First deck</title>
  <style>
@page {
  size: 56mm 87mm;
  margin: 0;
}
html,
body {
  margin: 0;
  padding: 0;
  width: 56mm;
  background: #fff;
}

.card {
  position: relative;
  box-sizing: border-box;
  overflow: hidden;
  color: #000;
  background: #fff;
  font-family: "Times New Roman", Times, serif;
  border: 1mm solid #000;
  border-radius: 3mm;
  page-break-after: always;
  display: flex;
  flex-direction: column;
}
.card .header {
  padding: 4mm 4mm 2mm;
  border-bottom: 0.5mm solid #000;
}
.card .header .name {
  font-size: 16pt;
  font-weight: bold;
  text-align: center;
}
.card .body {
  flex: 1;
  padding: 4mm;
  font-size: 11pt;
  line-height: 1.35;
}
.card .footer {
  padding: 2mm 4mm 3mm;
  font-size: 8pt;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-align: center;
  color: #444;
}  </style>
</head>
<body>
  <article class="card" style="width: 56.0mm; height: 87.0mm;">
    <header class="header">
      <div class="name">Literal card</div>
    </header>
    <div class="body">
      <p class="description">This card uses no placeholders. Edit the text as-is.</p>
    </div>
    <footer class="footer">New game</footer>
  </article>
  <article class="card" style="width: 56.0mm; height: 87.0mm;">
    <header class="header">
      <div class="name">Sized card</div>
    </header>
    <div class="body">
      <p class="description">This card reads only card.json5: 56.0×87.0 mm, label standard.</p>
    </div>
    <footer class="footer">New game</footer>
  </article>
</body>
</html>

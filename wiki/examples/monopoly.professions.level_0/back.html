<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Профессии L0 — рубашка</title>
  <style>
@page {
  size: 56mm 87mm;
  margin: 0;
}
html,
body {
  margin: 0;
  padding: 0;
  width: 56mm;
  height: 87mm;
  background: #fff;
}

.card-back {
  position: relative;
  box-sizing: border-box;
  width: 56mm;
  height: 87mm;
  overflow: hidden;
  color: #000;
  background: #fff;
  font-family: "Times New Roman", Times, serif;
  border: 1mm solid #000;
  border-radius: 3mm;
}
.card-back .inner {
  position: absolute;
  left: 4mm;
  top: 4mm;
  right: 4mm;
  bottom: 4mm;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4mm;
  border: 0.5mm solid #000;
  border-radius: 2mm;
  padding: 4mm;
  text-align: center;
}
.card-back .inner .game {
  font-size: 9pt;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.card-back .inner .category {
  font-size: 11pt;
}
.card-back .inner .title {
  font-size: 16pt;
  font-weight: bold;
}  </style>
</head>
<body>
  <article class="card-back" style="width: 56.0mm; height: 87.0mm;">
    <div class="inner">
      <div class="game">Монополия 2.0</div>
      <div class="title">Профессии L0</div>
      <div class="category">«Без образования»</div>
    </div>
  </article>
</body>
</html>

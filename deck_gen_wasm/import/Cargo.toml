[package]
name = "deck_gen_wasm_import"
version.workspace = true
edition.workspace = true
description = "Pick local files or a folder and install them into the VFS"

[lib]
path = "src/lib.rs"

[dependencies]
deck_gen_wasm_browser = { path = "../browser" }
deck_gen_wasm_conf = { path = "../conf" }
deck_gen_wasm_fs = { path = "../fs" }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "DomStringList",
    "Element",
    "Event",
    "File",
    "FileList",
    "HtmlInputElement",
    "Node",
    "Window",
] }

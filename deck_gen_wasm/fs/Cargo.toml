[package]
name = "deck_gen_wasm_fs"
version.workspace = true
edition.workspace = true
description = "In-memory workspace VFS for the browser editor"

[lib]
path = "src/lib.rs"

[dependencies]
# Shared extension tables and constants (used by kind classification)
deck_gen_wasm_conf = { path = "../conf" }
# Serialization for localStorage snapshots (Vfs + Node)
serde = { version = "1", features = ["derive"] }

[package]
name = "deck_gen_wasm_locale"
version.workspace = true
edition.workspace = true
description = "Reactive EN/RU localization for chrome UI strings"

[lib]
path = "src/lib.rs"

[dependencies]
deck_gen_wasm_conf = { path = "../conf" }
leptos = { version = "0.8", features = ["csr"] }
json5 = "0.4"
serde = { version = "1", features = ["derive"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element"] }

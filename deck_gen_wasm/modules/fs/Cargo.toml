[package]
name = "deck_gen_wasm_fs"
version.workspace = true
edition.workspace = true
description = "In-memory workspace VFS for the browser editor"

[lib]
path = "src/lib.rs"

[dependencies]
# Shared extension tables and constants (used by kind classification)
deck_gen_wasm_conf = { path = "../conf" }
# deck_gen FileSystem trait + Error/Result for the VfsFs adapter
deck_gen = { path = "../../../deck_gen", default-features = false }
# Serialization for localStorage snapshots (Vfs + Node)
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# progress + Noop for VfsFs integration tests that exercise prepare_html
progress_viewer = { path = "../../../progress_viewer" }

[package]
name = "deck_gen_wasm_browser"
version.workspace = true
edition.workspace = true
description = "Browser JS FFI, HTTP GET, and bounded async join"

[lib]
path = "src/lib.rs"

[dependencies]
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
gloo-net = "0.6"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Window",
] }

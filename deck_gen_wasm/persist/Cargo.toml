[package]
name = "deck_gen_wasm_persist"
version.workspace = true
edition.workspace = true
description = "localStorage session and IndexedDB binaries"

[lib]
path = "src/lib.rs"

[dependencies]
deck_gen_wasm_conf = { path = "../conf" }
deck_gen_wasm_fs = { path = "../fs" }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "DomStringList",
    "Event",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "Storage",
    "Window",
] }

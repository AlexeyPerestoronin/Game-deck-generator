[package]
name = "deck_gen_wasm_export"
version.workspace = true
edition.workspace = true
description = "ZIP encode and browser download of the workspace"

[lib]
path = "src/lib.rs"

[dependencies]
deck_gen_wasm_browser = { path = "../browser" }
deck_gen_wasm_conf = { path = "../conf" }
deck_gen_wasm_fs = { path = "../fs" }
# 0..=100 reporting while entries are added to the ZIP
progress_viewer = { path = "../../progress_viewer" }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "HtmlAnchorElement",
    "Url",
    "Window",
] }
zip = { version = "2", default-features = false, features = ["deflate"] }

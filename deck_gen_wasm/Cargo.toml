[package]
name = "deck_gen_wasm"
version.workspace = true
edition.workspace = true
description = "Browser WASM app: virtual workspace editor"

[dependencies]
# Route panics to the browser console instead of aborting silently.
console_error_panic_hook = "0.1"
# Enable the JS entropy backend for transitive `getrandom` (see `.cargo/config.toml`).
getrandom = { version = "0.3", features = ["wasm_js"] }
# Leptos CSR mount in `main`.
leptos = { version = "0.8", features = ["csr"] }
# Shell layout: activity bar, explorer, editor, autosave.
deck_gen_wasm_ui = { path = "ui" }

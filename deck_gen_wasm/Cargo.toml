[package]
name = "deck_gen_wasm"
version.workspace = true
edition.workspace = true
description = "Browser WASM app: virtual workspace editor"

[dependencies]
# Route panics to the browser console instead of aborting silently.
console_error_panic_hook = "0.1"
# Shared JSON5 → HTML pipeline; wasm builds omit the native CLI/PDF feature.
deck_gen = { path = "../deck_gen", default-features = false }
# Browser HTML→PDF engine for `deck_gen::prepare_pdf`.
prepare_pdf_web = { path = "../prepare_pdf_web" }
# Enable the JS entropy backend for transitive `getrandom` (see `.cargo/config.toml`).
getrandom = { version = "0.3", features = ["wasm_js"] }
# HTTP fetch of the `new-game` template from GitHub / the Trunk local copy.
gloo-net = "0.6"
# Delayed tooltips and a 0ms yield before `prepare_html` so the UI can paint.
gloo-timers = { version = "0.3", features = ["futures"] }
# `Reflect` / `Function` / typed arrays for the directory picker and ZIP save.
js-sys = "0.3"
# Client-side reactive UI (explorer, editor, activity bar).
leptos = { version = "0.8", features = ["csr"] }
# Markdown → HTML for preview tabs.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# `Session` and GitHub tree JSON.
serde = { version = "1", features = ["derive"] }
# localStorage snapshot encode/decode and GitHub API tree parsing.
serde_json = "1"
# TextMate syntax highlighting in the editor (`default-fancy` avoids onig).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# JS interop (`JsCast`, `JsValue`, closures) for DOM and File System Access.
wasm-bindgen = "0.2"
# `spawn_local` for folder pick, template fetch, ZIP download, and HTML prepare.
wasm-bindgen-futures = "0.4"
# DOM, File, Blob, localStorage, IndexedDB, and download-anchor APIs used by the UI.
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "DomStringList",
    "Element",
    "Event",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "Node",
    "Storage",
    "Url",
    "Window",
] }
# Encode the in-memory workspace as a downloadable ZIP.
zip = { version = "2", default-features = false, features = ["deflate"] }

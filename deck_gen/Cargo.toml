[package]
name = "deck_gen"
version.workspace = true
edition.workspace = true
description = "Load Monopoly 2.0 deck JSON5 and render card HTML (CLI PDF on native hosts)"

[lib]
name = "deck_gen"
path = "src/lib.rs"

[[bin]]
name = "deck_gen"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# Native CLI only. wasm builds must use --no-default-features so Chromium
# PDF code is not compiled or linked. Parallelism (--concurrency) also disabled for wasm.
cli = ["dep:clap", "dep:prepare_pdf_host", "dep:pollster", "dep:rayon"]

[dependencies]
# Subcommands (list/html/pdf/png) and flag parsing for the native binary.
clap = { version = "4", features = ["derive"], optional = true }
# Block on async prepare_pdf/prepare_png in native CLI.
pollster = { version = "0.4", optional = true }
# Parallel deck processing for --concurrency in native CLI only.
rayon = { version = "1", optional = true }
# A4 duplex imposition and JPEG-page PDFs (used by both wasm + native).
lopdf = "0.34"
# ProgressHandler used by prepare_* commands and engine wrappers.
progress_viewer = { path = "../progress_viewer" }
# SCSS -> CSS compilation inside the MiniJinja loader (for .scss templates).
grass = "0.13"
# Parse conf.json5 + deck data.json5 + named vars files (supports comments and trailing commas).
json5 = "0.4"
# HTML templates (face/back/preview) + Jinja inside .scss rendering.
minijinja = { version = "2", features = ["loader"] }
# Split life-effects strings and generate slugs for cards.
regex = "1"
# Deserialize root conf.json5 and per-game game.json5 schemas.
serde = { version = "1", features = ["derive"] }
# Preserve order in JSON maps for deck fields/cards; used for placeholder resolution too.
serde_json = { version = "1", features = ["preserve_order"] }
# Error type with derives for IO/JSON/JSON5/Template/PDF failures.
thiserror = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Chromium (CDP) for PDF generation and PNG rasterization. Native CLI only.
prepare_pdf_host = { path = "../prepare_pdf_host", optional = true }

[package]
name = "deck_gen_wasm_template"
version.workspace = true
edition.workspace = true
description = "GitHub new-game template and bundled user help"

[lib]
path = "src/lib.rs"

[dependencies]
deck_gen_wasm_browser = { path = "../browser" }
deck_gen_wasm_conf = { path = "../conf" }
deck_gen_wasm_fs = { path = "../fs" }
# 0..=100 reporting inside install_new_game loops
progress_viewer = { path = "../../../progress_viewer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

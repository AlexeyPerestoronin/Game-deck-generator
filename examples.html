<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Примеры работ — Game Deck Generator</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", Times, serif;
      background: #d8d8d8;
      color: #222;
    }
    form {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #bbb;
    }
    label, select, button { font: 16px/1.3 Georgia, "Times New Roman", serif; }
    select, button { padding: 6px 10px; }
    h1 {
      font-size: 18pt;
      margin: 16px 16px 12px;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 8mm;
      align-items: flex-start;
      padding: 0 16px 24px;
    }
    .gallery iframe {
      border: 0;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <form id="examples-form" action="#" method="get">
    <label for="example">Колода</label>
    <select id="example" name="example">
      <option value="wiki/examples/monopoly.professions.level_0" data-face-h="783" data-back-h="87">Монополия — профессии L0</option>
      <option value="wiki/examples/monopoly.achievements" data-face-h="522" data-back-h="87">Монополия — достижения</option>
      <option value="wiki/examples/monopoly.events.positives.lucky_day" data-face-h="87" data-back-h="87">Монополия — счастливый день</option>
      <option value="wiki/examples/monopoly.events.negatives.pandemic" data-face-h="87" data-back-h="87">Монополия — пандемия</option>
      <option value="wiki/examples/monopoly.professions.tracking.judge" data-face-h="696" data-back-h="87">Монополия — судья (трекинг)</option>
      <option value="wiki/examples/new-game.deck-1st" data-face-h="174" data-back-h="87">Шаблон new-game — первая колода</option>
    </select>
    <button type="button" id="prev" aria-label="Предыдущий пример">←</button>
    <button type="button" id="next" aria-label="Следующий пример">→</button>
  </form>
  <h1 id="heading"></h1>
  <div class="gallery">
    <iframe id="face" class="faces" title="Лицо" src="about:blank"></iframe>
    <iframe id="back" class="back" title="Рубашка" src="about:blank"></iframe>
  </div>
  <script>
    (function () {
      var sel = document.getElementById("example");
      var face = document.getElementById("face");
      var back = document.getElementById("back");
      var heading = document.getElementById("heading");
      var form = document.getElementById("examples-form");

      function show(i) {
        var n = sel.options.length;
        sel.selectedIndex = ((i % n) + n) % n;
        var opt = sel.options[sel.selectedIndex];
        var dir = opt.value;
        heading.textContent = opt.text;
        face.style.width = "56mm";
        face.style.height = opt.getAttribute("data-face-h") + "mm";
        back.style.width = "56mm";
        back.style.height = opt.getAttribute("data-back-h") + "mm";
        face.src = dir + "/face.html";
        back.src = dir + "/back.html";
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        show(sel.selectedIndex);
      });
      sel.addEventListener("change", function () { show(sel.selectedIndex); });
      document.getElementById("prev").addEventListener("click", function () { show(sel.selectedIndex - 1); });
      document.getElementById("next").addEventListener("click", function () { show(sel.selectedIndex + 1); });

      var q = new URLSearchParams(location.search).get("example");
      var start = 0;
      if (q) {
        for (var i = 0; i < sel.options.length; i++) {
          if (sel.options[i].value.indexOf(q) !== -1) { start = i; break; }
        }
      }
      show(start);
    })();
  </script>
</body>
</html>

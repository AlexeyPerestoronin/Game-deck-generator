[package]
name = "prepare_pdf_web"
version.workspace = true
edition.workspace = true
description = "Browser HTML→PDF/PNG for deck_gen (PdfEngineGenerator + CardPngGenerator)"

[dependencies]
# Re-exports CardSize, provides pdf_from_jpeg_pages; no native/chrome.
deck_gen = { path = "../deck_gen", default-features = false }
# Typed arrays and Reflect for results from raster JS.
js-sys = "0.3"
# Bind htmlToJpegPages / htmlToPng from the JS module.
wasm-bindgen = "0.2"
# Convert JS promises from canvas raster to Rust futures.
wasm-bindgen-futures = "0.4"
